[project]
name = "openbrain"
version = "0.1.0"
description = "An open-source spiking brain simulator"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Nabhan Lyric Chowdhury" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "openbrain._core"
features = ["python"]

[dependency-groups]
bench = [
    "neuron>=9.0.2",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
openbrain = "openbrain.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["openbrain"]

[tool.uv]
# rebuild the Rust extension whenever its sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "src/**/*.rs" }]
