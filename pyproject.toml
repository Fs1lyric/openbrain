[project]
name = "openbrain"
version = "0.1.0"
description = "An open-source spiking brain simulator"
license = "MIT"
readme = "README.md"
authors = [
    { name = "Nabhan Lyric Chowdhury" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
openbrain = "openbrain.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
