name: Site screenshots

on:
  push:
    branches: [main]
    paths: [docs/site/**, .github/workflows/site-shot.yml]
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - name: Screenshot desktop and phone
        run: |
          python3 -m http.server 8000 -d docs/site &
          sleep 2
          cat > shot.mjs <<'EOF'
          import { chromium } from "playwright";
          const browser = await chromium.launch({ args: ["--use-gl=swiftshader", "--enable-unsafe-swiftshader"] });
          let failed = false;
          for (const [name, viewport] of [["desktop", { width: 1440, height: 900 }], ["phone", { width: 390, height: 844 }]]) {
            const page = await browser.newPage({ viewport });
            page.on("pageerror", e => { failed = true; console.log(`[${name}] page error: ${e.message}`); });
            page.on("console", m => m.type() === "error" && console.log(`[${name}] console: ${m.text()}`));
            await page.goto("http://localhost:8000/", { waitUntil: "networkidle" });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: `shots/${name}-top.png` });
            // Reveal-on-scroll content: scroll through, then open one details toggle and capture full page.
            await page.evaluate(async () => { for (let y = 0; y < document.body.scrollHeight; y += 400) { window.scrollTo(0, y); await new Promise(r => setTimeout(r, 120)); } });
            await page.evaluate(() => document.querySelector("#xor details.tech")?.setAttribute("open", ""));
            await page.waitForTimeout(800);
            await page.screenshot({ path: `shots/${name}-full.png`, fullPage: true });
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            console.log(`[${name}] horizontal overflow: ${overflow}px`);
            if (overflow > 0) failed = true;
          }
          await browser.close();
          process.exit(failed ? 1 : 0);
          EOF
          mkdir -p shots && node shot.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-shots
          path: shots/
